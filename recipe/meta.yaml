{% set name = "torchrecurrent" %}
{% set version = "0.2.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/torchrecurrent-{{ version }}.tar.gz
  sha256: 8c7bbeee0481b94177c12079dae6b69de7742559912364d1d54a09ad49d6165b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - pytorch

test:
  imports:
    - torchrecurrent
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/MartinuzziFrancesco/torchrecurrent
  summary: A package for recurrent neural networks in PyTorch
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MartinuzziFrancesco
